server:
  port: 8083

spring:
  application:
    name: complaint-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:auth_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:root}}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}

  flyway:
    enabled: true
    table: flyway_schema_history_complaint
    baseline-on-migrate: true
    baseline-version: 0

app:
  jwt:
    secret: ${JWT_SECRET:supersecretkey-supersecretkey-supersecretkey-32bytes+}

clients:
  auth-service:
    base-url: ${AUTH_SERVICE_BASE_URL:http://localhost:8081}
  department-service:
    base-url: ${DEPARTMENT_SERVICE_BASE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
